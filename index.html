<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>菜单翻译</title>
  <style>
    /* ---------- Design tokens (one place to tweak the whole look) ---------- */
    :root {
      --ink:    #1a1a1a;   /* main text  */
      --muted:  #8c8c8c;   /* secondary text */
      --line:   #ececec;   /* hairline borders */
      --bg:     #fbfbf9;   /* warm off-white background */
      --card:   #ffffff;
      --accent: #e8623a;   /* warm terracotta */
      --good:   #2e7d4f;
      --okay:   #b07d00;
      --avoid:  #c0392b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                   "Microsoft YaHei", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 18px 48px; }

    /* ---------- Header ---------- */
    header {
      text-align: center;
      padding: 40px 0 24px;
    }
    .logo { font-size: 30px; }
    h1 {
      font-size: 21px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin: 10px 0 4px;
    }
    .tagline { color: var(--muted); font-size: 14px; margin: 0; }

    /* ---------- Capture button ---------- */
    .capture {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 17px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: transform .08s ease, opacity .2s ease;
      box-shadow: 0 6px 18px rgba(232, 98, 58, 0.25);
    }
    .capture:active { transform: scale(0.98); }
    input[type="file"] { display: none; }

    /* ---------- Status line ---------- */
    #status {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      min-height: 22px;
      margin: 22px 0 6px;
    }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #e0e0e0;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      vertical-align: -3px;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- Dish card ---------- */
    .dish {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 18px;
      animation: rise .4s ease both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }

    /* photo gallery — a smooth horizontal carousel */
    .gallery {
      display: flex;
      gap: 2px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      background: #f2f2f0;
      scrollbar-width: none;
    }
    .gallery::-webkit-scrollbar { display: none; }
    .gallery img {
      width: 100%;
      height: 200px;
      flex: 0 0 100%;
      object-fit: cover;
      scroll-snap-align: start;
      display: block;
    }
    .gallery.skeleton {
      height: 200px;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
    }

    .body { padding: 18px 18px 20px; }
    .name { font-size: 20px; font-weight: 650; margin: 0; }
    .original { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
    .desc { font-size: 14px; color: #4a4a4a; margin: 10px 0 0; }

    /* nutrition — minimal stat row */
    .stats {
      display: flex;
      margin: 18px 0 4px;
      border-top: 1px solid var(--line);
      padding-top: 16px;
    }
    .stat { flex: 1; text-align: center; }
    .stat .num { font-size: 18px; font-weight: 650; }
    .stat .lab { font-size: 11px; color: var(--muted); margin-top: 2px; letter-spacing: .3px; }
    .stat + .stat { border-left: 1px solid var(--line); }

    /* health pill */
    .health {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 13px;
      font-size: 13.5px;
      line-height: 1.45;
      background: #f7f7f5;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; flex: 0 0 auto; }
    .health b { font-weight: 650; }
    .good { color: var(--good); } .good  .dot { background: var(--good); }
    .okay { color: var(--okay); } .okay  .dot { background: var(--okay); }
    .avoid{ color: var(--avoid);} .avoid .dot { background: var(--avoid); }
    .health span.txt { color: #4a4a4a; }

    footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">🍽️</div>
      <h1>菜单翻译</h1>
      <p class="tagline">拍下菜单 · 中文翻译 · 营养与健康建议</p>
    </header>

    <button class="capture" onclick="document.getElementById('photoInput').click()">
      <span style="font-size:20px">📷</span> 拍照菜单
    </button>
    <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="uploadPhoto()">

    <div id="status"></div>
    <div id="results"></div>

    <footer>为爸爸而做 ❤️</footer>
  </div>

  <script>
    async function uploadPhoto() {
      const fileInput = document.getElementById('photoInput');
      const status = document.getElementById('status');
      const results = document.getElementById('results');
      results.innerHTML = '';
      if (!fileInput.files.length) return;

      status.innerHTML = '<span class="spinner"></span>正在翻译菜单…';

      const formData = new FormData();
      formData.append('photo', fileInput.files[0]);

      try {
        const response = await fetch('/translate', { method: 'POST', body: formData });
        const data = await response.json();

        if (data.error) { status.textContent = '出错了：' + data.error; return; }

        const dishes = data.dishes || [];
        if (dishes.length === 0) {
          status.textContent = '没有找到菜品，请换一张更清晰的照片。';
          return;
        }
        status.textContent = '共 ' + dishes.length + ' 道菜';

        const healthMap = {
          '推荐':   { cls: 'good',  label: '推荐' },
          '不推荐': { cls: 'avoid', label: '不推荐' },
        };
        const health = r => healthMap[r] || { cls: 'okay', label: r || '适中' };
        const esc = s => (s ?? '').toString()
          .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

        results.innerHTML = dishes.map((d, i) => {
          const h = health(d.rating);
          return `
          <div class="dish" style="animation-delay:${i * 0.05}s">
            <div class="gallery skeleton" id="g-${i}">正在加载图片…</div>
            <div class="body">
              <p class="name">${esc(d.chinese)}</p>
              <p class="original">${esc(d.original)}</p>
              <p class="desc">${esc(d.description)}</p>
              <div class="stats">
                <div class="stat"><div class="num">${d.calories ?? '–'}</div><div class="lab">卡路里</div></div>
                <div class="stat"><div class="num">${d.protein_g ?? '–'}<small>g</small></div><div class="lab">蛋白质</div></div>
                <div class="stat"><div class="num">${d.carbs_g ?? '–'}<small>g</small></div><div class="lab">碳水</div></div>
                <div class="stat"><div class="num">${d.fat_g ?? '–'}<small>g</small></div><div class="lab">脂肪</div></div>
              </div>
              <div class="health ${h.cls}">
                <span class="dot"></span>
                <span><b>${h.label}</b> · <span class="txt">${esc(d.health_note)}</span></span>
              </div>
            </div>
          </div>`;
        }).join('');

        // Load photos for each dish and slot them into the gallery as they arrive.
        dishes.forEach(async (d, i) => {
          const box = document.getElementById('g-' + i);
          try {
            const q = d.image_query || d.original || d.chinese;
            const res = await fetch('/images?q=' + encodeURIComponent(q));
            const urls = (await res.json()).images || [];
            if (!urls.length) { box.textContent = '暂无图片'; return; }
            box.classList.remove('skeleton');
            box.innerHTML = urls.map(u =>
              `<img src="${u}" loading="lazy" onerror="this.remove()">`).join('');
          } catch (e) {
            box.textContent = '图片加载失败';
          }
        });
      } catch (err) {
        status.textContent = '出错了：' + err.message;
      } finally {
        fileInput.value = '';
      }
    }
  </script>
</body>
</html>
